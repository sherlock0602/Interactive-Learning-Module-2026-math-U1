<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第 8 單元：整數四則運算 互動探索教室</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #f0f9ff 82%, #fef3c7 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #0f172a;
    }

    /* 超寬主舞台毛玻璃卡片 */
    .widescreen-shell {
      width: 96vw;
      max-width: 1520px;
      margin-left: auto;
      margin-right: auto;
    }

    .stage-glass {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 50px -12px rgba(2, 132, 199, 0.2);
    }

    /* 背景雲朵慢速飄動 */
    @keyframes floatCloudSlow {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(34px); }
    }
    @keyframes floatCloudFast {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-28px); }
    }
    .cloud-slow { animation: floatCloudSlow 18s ease-in-out infinite; }
    .cloud-fast { animation: floatCloudFast 12s ease-in-out infinite; }

    /* 海浪微幅波動 */
    @keyframes waveShift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-22px); }
    }
    .wave-anim { animation: waveShift 9s ease-in-out infinite; }

    /* 第一拍：聚光燈呼吸閃爍光暈 */
    @keyframes spotlightPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.75);
        transform: scale(1.06);
      }
      50% {
        box-shadow: 0 0 24px 8px rgba(245, 158, 11, 0.45);
        transform: scale(1.11);
      }
    }
    .actor-spotlight {
      animation: spotlightPulse 0.95s ease-in-out infinite;
      z-index: 20;
    }

    @keyframes cyanSpotlight {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.75);
        transform: scale(1.05);
      }
      50% {
        box-shadow: 0 0 24px 8px rgba(14, 165, 233, 0.45);
        transform: scale(1.09);
      }
    }
    .cyan-spotlight {
      animation: cyanSpotlight 0.95s ease-in-out infinite;
      z-index: 20;
    }

    /* 物件彈跳慶祝 */
    @keyframes popBounce {
      0% { transform: scale(0.75); opacity: 0.4; }
      60% { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-bounce {
      animation: popBounce 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* X 光雷射掃描光束 */
    @keyframes xrayBeamSweep {
      0% { left: -8%; opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { left: 104%; opacity: 0; }
    }
    .xray-beam-run {
      animation: xrayBeamSweep 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 舞台進場動畫 */
    @keyframes stageEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stage-enter {
      animation: stageEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 平滑物理緩動曲線 */
    .smooth-actor {
      transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 自訂土地拼貼滑桿（大屏與平板觸控友善） */
    input[type="range"].land-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0284c7 0%, #059669 100%);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].land-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f59e0b;
      border: 4px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].land-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .math-font {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="relative flex flex-col min-h-screen selection:bg-sky-200 selection:text-sky-900">

  <!-- ==================== 晴空海岸與野柳女王頭背景插畫 ==================== -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <!-- 暖陽與光暈 -->
    <div class="absolute top-6 right-12 w-44 h-44 rounded-full bg-amber-300/35 blur-2xl"></div>
    <div class="absolute top-10 right-16 w-24 h-24 rounded-full bg-amber-200/80 shadow-lg shadow-amber-300/40"></div>

    <!-- 漂浮白雲 -->
    <svg class="cloud-slow absolute top-14 left-[4%] w-52 h-24 text-white/80" viewBox="0 0 200 80" fill="currentColor">
      <path d="M45 65h110a25 25 0 0 0 4-49.7A35 35 0 0 0 92 12a30 30 0 0 0-52 21A22 22 0 0 0 45 65z" />
    </svg>
    <svg class="cloud-fast absolute top-28 right-[18%] w-40 h-18 text-white/75" viewBox="0 0 200 80" fill="currentColor">
      <path d="M45 65h110a25 25 0 0 0 4-49.7A35 35 0 0 0 92 12a30 30 0 0 0-52 21A22 22 0 0 0 45 65z" />
    </svg>

    <!-- 底部海浪與野柳女王頭剪影 -->
    <svg class="absolute bottom-0 left-0 w-full h-56 md:h-72" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#7dd3fc" fill-opacity="0.45" d="M0,210 Q360,185 720,205 T1440,195 L1440,320 L0,320 Z" />
      <path class="wave-anim" fill="#38bdf8" fill-opacity="0.35" d="M0,235 Q240,215 480,235 T960,235 T1440,235 L1440,320 L0,320 Z" />
      <g fill="#d97706" fill-opacity="0.22">
        <path d="M980,320 L1040,255 Q1110,230 1165,215 L1173,172 Q1156,158 1162,135 Q1168,112 1196,112 Q1222,114 1226,136 Q1228,150 1212,163 L1210,182 Q1206,202 1222,218 Q1295,235 1370,268 L1440,320 Z" />
      </g>
      <path fill="#0284c7" fill-opacity="0.16" d="M0,275 Q320,255 640,275 T1280,275 T1440,270 L1440,320 L0,320 Z" />
    </svg>
  </div>

  <!-- ==================== 頂部超寬導覽列 ==================== -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b-2 border-sky-200/90 shadow-sm">
    <div class="widescreen-shell py-2.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-600 to-emerald-600 flex items-center justify-center shadow-md shrink-0">
          <svg class="w-8 h-8" viewBox="0 0 48 48" fill="none">
            <path d="M24 38V22" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
            <path d="M24 24C24 16 14 12 9 16C5 19 8 27 16 27C20 27 24 25 24 24Z" fill="#bef264" stroke="#ffffff" stroke-width="2" />
            <path d="M24 21C24 13 34 9 39 13C43 16 40 24 32 24C28 24 24 22 24 21Z" fill="#fde047" stroke="#ffffff" stroke-width="2" />
            <circle cx="24" cy="39" r="3" fill="#ffffff" />
          </svg>
        </div>
        <div>
          <div class="text-xs sm:text-sm font-bold text-sky-700">康軒五上數學 ・ 16:9 互動教學大屏</div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">第 8 單元：整數四則運算</h1>
        </div>
      </div>

      <!-- 三小節主分頁按鈕 -->
      <nav class="grid grid-cols-3 gap-2.5" aria-label="單元小節切換">
        <button id="sec-tab-1" onclick="switchSection(1)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-black text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-sky-600 text-white shadow">
          <span class="px-2 py-0.5 rounded-lg bg-white text-sky-700 text-xs sm:text-sm font-black">8-1</span>
          <span>兩步驟連除問題</span>
        </button>
        <button id="sec-tab-2" onclick="switchSection(2)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-sky-200 hover:bg-sky-50">
          <span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-xs sm:text-sm font-black">8-2</span>
          <span>多步驟問題</span>
        </button>
        <button id="sec-tab-3" onclick="switchSection(3)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-sky-200 hover:bg-sky-50">
          <span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-xs sm:text-sm font-black">8-3</span>
          <span>分配律</span>
        </button>
      </nav>
    </div>

    <!-- 4 階段步驟膠囊列 -->
    <div class="bg-sky-50/90 border-t border-sky-100">
      <div class="widescreen-shell py-2">
        <div id="activity-stepper" class="grid grid-cols-4 gap-2.5"></div>
      </div>
    </div>
  </header>

  <!-- ==================== 超寬單一主舞台容器 (96vw / max-w-1520px) ==================== -->
  <main class="relative z-10 flex-1 flex items-center justify-center py-4 sm:py-5">
    <section id="main-stage-card" class="widescreen-shell stage-glass rounded-3xl p-5 sm:p-7 lg:p-8 flex flex-col justify-between min-h-[600px] stage-enter">

      <!-- 舞台頂部：活動標題、課本題幹、重播按鈕（無任何說教文字提示條） -->
      <div>
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 pb-4 border-b-2 border-sky-100">
          <div class="space-y-1">
            <div class="flex flex-wrap items-center gap-2.5">
              <span id="stage-pill" class="px-3.5 py-1 rounded-xl bg-sky-600 text-white font-black text-sm sm:text-base">8-1 ・ 活動 1</span>
              <h2 id="stage-heading" class="text-2xl sm:text-3xl font-black text-slate-900">女王鉛筆分裝透視機</h2>
            </div>
            <p id="stage-problem" class="text-base sm:text-xl font-bold text-slate-700 pt-1">
              老師買了 24 枝女王鉛筆，每 2 枝裝 1 包，每 3 包装 1 盒，共裝成幾盒？
            </p>
          </div>

          <div class="flex items-center gap-3 shrink-0">
            <button id="replay-btn" onclick="replayCurrentActivity()" class="px-5 py-3 rounded-2xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 text-amber-950 font-black text-sm sm:text-base shadow-sm transition active:scale-95 flex items-center gap-2">
              <span>↻ 重播本步動畫</span>
            </button>
          </div>
        </div>

        <!-- 舞台中央視覺互動區（每次僅呈現一個模組） -->
        <div id="stage-canvas" class="mt-5"></div>
      </div>

      <!-- 舞台底部：大型上一個／下一個活動切換列 -->
      <div class="mt-6 pt-4 border-t-2 border-slate-100 flex items-center justify-between gap-4">
        <button id="btn-prev-act" onclick="goPrevActivity()" class="px-6 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 disabled:opacity-35 disabled:cursor-not-allowed text-slate-800 font-black text-base sm:text-lg transition active:scale-95 flex items-center gap-2">
          <span>⬅ 上一個活動</span>
        </button>

        <div id="bottom-dots" class="flex items-center gap-2.5"></div>

        <button id="btn-next-act" onclick="goNextActivity()" class="px-7 py-3.5 rounded-2xl bg-sky-600 hover:bg-sky-700 disabled:opacity-35 disabled:cursor-not-allowed text-white font-black text-base sm:text-lg shadow-md transition active:scale-95 flex items-center gap-2">
          <span id="next-act-text">下一個活動 ➡</span>
        </button>
      </div>
    </section>
  </main>

  <!-- ==================== 完整視覺編排動畫與互動邏輯 ==================== -->
  <script>
    // =========================================================================
    // 全局狀態與動畫排程器
    // =========================================================================
    let activeSection = 1;
    let activeStep = 1;
    let scheduledTimers = [];
    let replayFn = null;

    const unitConfig = {
      1: {
        code: '8-1',
        title: '兩步驟連除問題',
        activities: [
          {
            pill: '活動 1：女王鉛筆分裝透視機',
            heading: '女王鉛筆分裝透視機（24 ÷ 2 ÷ 3 與 24 ÷ (2 × 3)）',
            problem: '老師買了 24 枝女王鉛筆，每 2 枝裝 1 包，每 3 包装 1 盒，共裝成幾盒？'
          },
          {
            pill: '活動 2：餅乾雙線分裝對照台',
            heading: '40 片餅乾雙線分裝對照台（40 ÷ 4 ÷ 5 vs 40 ÷ 5 ÷ 4）',
            problem: '烘焙坊有 40 片餅乾，路線 A「每 4 片一包、每 5 包一盒」與路線 B「每 5 片一包、每 4 包一盒」，各裝成幾盒？'
          },
          {
            pill: '活動 3：連除好算數字配對工廠',
            heading: '連除好算數字配對工廠（1300 ÷ 25 ÷ 4 與 8800 ÷ 16 ÷ 110）',
            problem: '觀察算式中的數字關係，直接點擊方塊配對或播放合併動畫，找出最快速的算法！'
          },
          {
            pill: '💡 本節重點總結',
            heading: '8-1 兩步驟連除問題 ・ 核心原理總結看板',
            problem: '回顧本小節透過分裝與數字配對所發現的三大運算規律：'
          }
        ]
      },
      2: {
        code: '8-2',
        title: '多步驟問題',
        activities: [
          {
            pill: '活動 1：帶符號磁鐵搬家台',
            heading: '帶符號磁鐵搬家台（加減與連減湊整百）',
            problem: '在只有加減的算式中，把好算的數字「連同前面的運算符號」一起搬家湊整百！'
          },
          {
            pill: '活動 2：雙主角蘋果思考透視鏡',
            heading: '雙主角蘋果思考透視鏡（豆豆 vs 妮妮）',
            problem: '3 顆蘋果賣 150 元，媽媽買 9 顆，付 1000 元鈔票，可以找回幾元？'
          },
          {
            pill: '活動 3：蛋塔與布丁價目線段拆解機',
            heading: '蛋塔與布丁價目線段拆解機',
            problem: '買 9 個蛋塔和 5 個布丁共花 415 元，1 個蛋塔賣 35 元，1 個布丁賣幾元？'
          },
          {
            pill: '💡 本節重點總結',
            heading: '8-2 多步驟問題 ・ 核心原理總結看板',
            problem: '回顧本小節簡化計算與多步驟應用題列式的三大關鍵：'
          }
        ]
      },
      3: {
        code: '8-3',
        title: '分配律',
        activities: [
          {
            pill: '活動 1：露營區與烤肉區土地拼貼台',
            heading: '露營區與烤肉區土地拼貼台（加法分配律）',
            problem: '露營區長 22m、烤肉區長 8m，兩塊地的寬都是 16m，合起來的面積是多少平方公尺？'
          },
          {
            pill: '活動 2：兒童樂園剪刀裁切模擬器',
            heading: '兒童樂園剪刀裁切模擬器（減法分配律）',
            problem: '兒童樂園總長 66m、寬 42m，扣除長 46m 的遊樂設施區後，戲水區面積是幾平方公尺？'
          },
          {
            pill: '活動 3：X 光「隱形 × 1」與單位轉換顯微鏡',
            heading: 'X 光「隱形 × 1」與單位轉換顯微鏡',
            problem: '啟動 X 光掃描鏡，找出算式裡隱藏的「× 1」與不同單位之間的秘密！'
          },
          {
            pill: '💡 本節重點總結',
            heading: '8-3 分配律 ・ 核心原理總結看板',
            problem: '回顧本小節圖形拼貼、裁切與算式變形的核心公式與破題秘訣：'
          }
        ]
      }
    };

    function clearTimers() {
      scheduledTimers.forEach(id => clearTimeout(id));
      scheduledTimers = [];
    }

    function later(fn, ms) {
      const id = setTimeout(fn, ms);
      scheduledTimers.push(id);
      return id;
    }

    function replayCurrentActivity() {
      clearTimers();
      if (typeof replayFn === 'function') {
        replayFn();
      } else {
        renderStage();
      }
    }

    function switchSection(sec) {
      clearTimers();
      activeSection = sec;
      activeStep = 1;
      renderStage();
    }

    function switchStep(step) {
      clearTimers();
      activeStep = step;
      renderStage();
    }

    function goPrevActivity() {
      if (activeStep > 1) {
        switchStep(activeStep - 1);
      } else if (activeSection > 1) {
        activeSection--;
        activeStep = 4;
        clearTimers();
        renderStage();
      }
    }

    function goNextActivity() {
      if (activeStep < 4) {
        switchStep(activeStep + 1);
      } else if (activeSection < 3) {
        activeSection++;
        activeStep = 1;
        clearTimers();
        renderStage();
      }
    }

    function renderStage() {
      // 更新頂部 3 個小節分頁
      [1, 2, 3].forEach(idx => {
        const tab = document.getElementById(`sec-tab-${idx}`);
        const badge = tab.querySelector('span');
        if (idx === activeSection) {
          tab.className = 'px-4 sm:px-6 py-2.5 rounded-2xl font-black text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-sky-600 text-white shadow ring-2 ring-sky-300';
          badge.className = 'px-2 py-0.5 rounded-lg bg-white text-sky-700 text-xs sm:text-sm font-black';
        } else {
          tab.className = 'px-4 sm:px-6 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-sky-200 hover:bg-sky-50';
          badge.className = 'px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-xs sm:text-sm font-black';
        }
      });

      // 更新 4 階段膠囊按鈕
      const cfg = unitConfig[activeSection];
      const stepper = document.getElementById('activity-stepper');
      stepper.innerHTML = cfg.activities.map((act, i) => {
        const stepNum = i + 1;
        const isCurrent = stepNum === activeStep;
        const isSummary = stepNum === 4;
        let cls = '';
        if (isCurrent) {
          cls = isSummary
            ? 'py-2.5 px-3 rounded-2xl font-black text-xs sm:text-base bg-amber-500 text-white shadow transition-all text-center truncate'
            : 'py-2.5 px-3 rounded-2xl font-black text-xs sm:text-base bg-sky-600 text-white shadow transition-all text-center truncate';
        } else {
          cls = 'py-2.5 px-3 rounded-2xl font-bold text-xs sm:text-base bg-white text-slate-700 border border-sky-200 hover:bg-sky-100/70 transition-all text-center truncate';
        }
        return `<button onclick="switchStep(${stepNum})" class="${cls}">${act.pill}</button>`;
      }).join('');

      // 更新標題、題幹與底部按鈕
      const act = cfg.activities[activeStep - 1];
      document.getElementById('stage-pill').textContent = `${cfg.code} ・ ${activeStep === 4 ? '重點總結' : '活動 ' + activeStep}`;
      document.getElementById('stage-heading').textContent = act.heading;
      document.getElementById('stage-problem').textContent = act.problem;

      const replayBtn = document.getElementById('replay-btn');
      replayBtn.style.display = activeStep === 4 ? 'none' : 'flex';

      const prevBtn = document.getElementById('btn-prev-act');
      const nextBtn = document.getElementById('btn-next-act');
      const nextTxt = document.getElementById('next-act-text');

      prevBtn.disabled = (activeSection === 1 && activeStep === 1);
      nextBtn.disabled = (activeSection === 3 && activeStep === 4);

      if (activeStep === 4 && activeSection < 3) {
        nextTxt.textContent = `前往 ${unitConfig[activeSection + 1].code} ${unitConfig[activeSection + 1].title} ➡`;
      } else if (activeSection === 3 && activeStep === 4) {
        nextTxt.textContent = '已完成全單元 🎉';
      } else {
        nextTxt.textContent = '下一個活動 ➡';
      }

      document.getElementById('bottom-dots').innerHTML = [1, 2, 3, 4].map(d => `
        <button onclick="switchStep(${d})" aria-label="切換至活動 ${d}"

            <div class="mt-5 p-4 rounded-2xl bg-white border-2 border-amber-200 math-font text-lg sm:text-xl font-black text-center text-amber-950">
              a × b ＋ a ＝ a × (b ＋ 1)
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================

    window.onload = function () {

  </script>
