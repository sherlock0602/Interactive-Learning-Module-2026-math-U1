<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第 8 單元：整數四則運算 16:9 寬螢幕互動教學教室</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #f0f9ff 80%, #fef3c7 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #0f172a;
    }

    /* 16:9 超寬螢幕主舞台容器：96vw / max-width 1560px */
    .widescreen-shell {
      width: 96vw;
      max-width: 1560px;
      margin-left: auto;
      margin-right: auto;
    }

    .stage-glass {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 2px solid rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 54px -12px rgba(2, 132, 199, 0.2);
    }

    /* 慢節奏核心過渡曲線：1.05s 平滑過渡 */
    .slow-actor {
      transition: all 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 透明袋淡出專用：1.2s 慢速透視 */
    .slow-bag-fade {
      transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.05s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 1.05s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==================== 100% 嚴格垂直對齊等號排版 ==================== */
    /* 左側固定 56px 欄位放等號，右側左對齊算式起點 */
    .eq-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .eq-row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      align-items: center;
      column-gap: 0.25rem;
    }

    .eq-sign-cell {
      width: 56px;
      text-align: center;
      font-weight: 900;
      color: #d97706;
      user-select: none;
      line-height: 1.2;
    }

    .eq-expr-cell {
      text-align: left;
      font-weight: 900;
      padding: 0.45rem 0.85rem;
      border-radius: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      background-color: rgba(248, 250, 252, 0.9);
      border: 2px solid transparent;
      transition: background-color 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
    }

    .eq-expr-cell.row-active {
      background-color: rgba(254, 243, 199, 0.85);
      border-color: rgba(245, 158, 11, 0.55);
      box-shadow: 0 8px 20px -6px rgba(245, 158, 11, 0.25);
    }

    /* ==================== Phase A：看圖列式片段滑入與子標籤 ==================== */
    .chunk-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border-radius: 0.85rem;
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chunk-sub {
      margin-top: 0.2rem;
      padding: 0.12rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    @keyframes chunkSlideIn {
      0% {
        opacity: 0;
        transform: translateX(22px) scale(0.9);
        background-color: rgba(253, 224, 71, 0.65);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        background-color: rgba(224, 242, 254, 0.9);
      }
    }

    .anim-chunk-in {
      animation: chunkSlideIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      border: 2px solid #38bdf8;
    }

    /* ==================== Phase B：式子變形核心動畫庫 ==================== */
    /* 1. 來源算式目標數字／符號聚光燈脈動 (.token-spotlight) */
    @keyframes tokenSpotlightPulse {
      0%, 100% {
        transform: scale(1.04);
        box-shadow: 0 0 0 3px #f59e0b, 0 0 18px 4px rgba(245, 158, 11, 0.65);
        background-color: #fef3c7;
        color: #92400e;
      }
      50% {
        transform: scale(1.13);
        box-shadow: 0 0 0 4px #0ea5e9, 0 0 26px 8px rgba(14, 165, 233, 0.55);
        background-color: #e0f2fe;
        color: #075985;
      }
    }

    .token-spotlight {
      display: inline-block;
      padding: 0.05rem 0.45rem;
      border-radius: 0.65rem;
      animation: tokenSpotlightPulse 1.1s ease-in-out infinite;
      z-index: 10;
    }

    /* 2. 新一行遞等式展開滑入 (.anim-row-slide) */
    @keyframes rowSlideDown {
      0% {
        opacity: 0;
        transform: translateY(-16px) scaleY(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
      }
    }

    .anim-row-slide {
      animation: rowSlideDown 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 3. 括號彈出包覆 (.anim-bracket-wrap) */
    @keyframes bracketExpand {
      0% {
        opacity: 0;
        transform: scale(0.35);
        color: #0284c7;
      }
      60% {
        opacity: 1;
        transform: scale(1.25);
        color: #d97706;
      }
      100% {
        opacity: 1;
        transform: scale(1);
        color: #b45309;
      }
    }

    .anim-bracket-wrap {
      display: inline-block;
      font-weight: 900;
      color: #b45309;
      padding: 0 0.1rem;
      animation: bracketExpand 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 4. 括號內運算符號 3D 翻轉變號 (.anim-op-flip) */
    @keyframes opFlip3D {
      0% {
        transform: perspective(400px) rotateY(0deg) scale(1);
        background-color: #e0f2fe;
        color: #0369a1;
      }
      50% {
        transform: perspective(400px) rotateY(180deg) scale(1.32);
        background-color: #fde047;
        color: #92400e;
      }
      100% {
        transform: perspective(400px) rotateY(360deg) scale(1.08);
        background-color: #d1fae5;
        color: #065f46;
      }
    }

    .anim-op-flip {
      display: inline-block;
      padding: 0.05rem 0.45rem;
      border-radius: 0.6rem;
      border: 2px solid #10b981;
      background-color: #d1fae5;
      color: #065f46;
      animation: opFlip3D 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 5. 帶符號數字水平飛躍換位 (.anim-fly-left / .anim-fly-right) */
    @keyframes flyFromRight {
      0% {
        opacity: 0.35;
        transform: translateX(135px) translateY(-10px) scale(1.12);
        background-color: #fde047;
        box-shadow: 0 10px 22px rgba(245, 158, 11, 0.45);
      }
      65% {
        opacity: 1;
        transform: translateX(-8px) translateY(-2px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
        background-color: #fef3c7;
      }
    }

    @keyframes flyFromLeft {
      0% {
        opacity: 0.45;
        transform: translateX(-95px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .anim-fly-left {
      display: inline-block;
      padding: 0.08rem 0.5rem;
      border-radius: 0.65rem;
      border: 2px solid #f59e0b;
      background-color: #fef3c7;
      animation: flyFromRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-fly-right {
      display: inline-block;
      padding: 0.08rem 0.5rem;
      border-radius: 0.65rem;
      animation: flyFromLeft 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 6. 公因數提出與合併 (.anim-factor-merge) */
    @keyframes factorMergePulse {
      0% {
        opacity: 0.25;
        transform: scale(1.38);
        background-color: #fde047;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.7);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        background-color: #d1fae5;
        box-shadow: 0 0 0 2px #10b981;
      }
    }

    .anim-factor-merge {
      display: inline-block;
      padding: 0.08rem 0.55rem;
      border-radius: 0.7rem;
      background-color: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
      animation: factorMergePulse 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 7. X 光隱形 × 1 顯影 (.anim-ghost-reveal) */
    @keyframes ghostMaterialize {
      0% {
        opacity: 0;
        transform: scale(0.4) translateX(-14px);
        filter: blur(4px);
      }
      65% {
        opacity: 1;
        transform: scale(1.18) translateX(0);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateX(0);
      }
    }

    .anim-ghost-reveal {
      display: inline-block;
      padding: 0.08rem 0.55rem;
      border-radius: 0.7rem;
      background-color: #fef3c7;
      color: #92400e;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
      animation: ghostMaterialize 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 最終答案金色脈動光環 */
    @keyframes goldAnswerGlow {
      0%, 100% {
        box-shadow: 0 0 0 3px #f59e0b, 0 0 18px 4px rgba(245, 158, 11, 0.45);
        transform: scale(1.01);
      }
      50% {
        box-shadow: 0 0 0 4px #10b981, 0 0 26px 8px rgba(16, 185, 129, 0.4);
        transform: scale(1.04);
      }
    }

    .final-answer-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.25rem 0.9rem;
      border-radius: 0.9rem;
      background-color: #fef3c7;
      color: #92400e;
      animation: goldAnswerGlow 2s ease-in-out infinite;
    }

    /* 天藍聚光燈呼吸閃爍（左側圖示用） */
    @keyframes skyPulseRing {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.75);
        transform: scale(1.01);
      }
      50% {
        box-shadow: 0 0 22px 8px rgba(56, 189, 248, 0.45);
        transform: scale(1.04);
      }
    }
    .sky-pulse-ring {
      animation: skyPulseRing 1.8s ease-in-out infinite;
      z-index: 20;
    }

    /* X 光顯微鏡掃描光束 */
    @keyframes xraySweep {
      0% { left: -25%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { left: 110%; opacity: 0.2; }
    }
    .xray-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.7), rgba(255, 255, 255, 0.95), rgba(56, 189, 248, 0.7), transparent);
      animation: xraySweep 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* 背景雲朵與海浪慢速飄動 */
    @keyframes floatCloudSlow {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(38px); }
    }
    @keyframes floatCloudFast {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
    }
    @keyframes waveShift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-24px); }
    }
    .cloud-slow { animation: floatCloudSlow 22s ease-in-out infinite; }
    .cloud-fast { animation: floatCloudFast 15s ease-in-out infinite; }
    .wave-anim { animation: waveShift 11s ease-in-out infinite; }

    /* 舞台進場動畫 */
    @keyframes stageFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stage-enter {
      animation: stageFadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .math-font {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="relative flex flex-col min-h-screen selection:bg-sky-200 selection:text-sky-900">

  <!-- ==================== 野柳晴空海岸風景背景 ==================== -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <!-- 暖陽與光暈 -->
    <div class="absolute top-6 right-14 w-48 h-48 rounded-full bg-amber-300/35 blur-2xl"></div>
    <div class="absolute top-10 right-16 w-24 h-24 rounded-full bg-amber-200/85 shadow-lg shadow-amber-300/40"></div>

    <!-- 漂浮白雲 -->
    <svg class="cloud-slow absolute top-14 left-[4%] w-56 h-24 text-white/85" viewBox="0 0 200 80" fill="currentColor">
      <path d="M45 65h110a25 25 0 0 0 4-49.7A35 35 0 0 0 92 12a30 30 0 0 0-52 21A22 22 0 0 0 45 65z" />
    </svg>
    <svg class="cloud-fast absolute top-28 right-[18%] w-44 h-20 text-white/80" viewBox="0 0 200 80" fill="currentColor">
      <path d="M45 65h110a25 25 0 0 0 4-49.7A35 35 0 0 0 92 12a30 30 0 0 0-52 21A22 22 0 0 0 45 65z" />
    </svg>

    <!-- 底部海浪與野柳女王頭剪影 -->
    <svg class="absolute bottom-0 left-0 w-full h-56 md:h-72" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#7dd3fc" fill-opacity="0.45" d="M0,210 Q360,185 720,205 T1440,195 L1440,320 L0,320 Z" />
      <path class="wave-anim" fill="#38bdf8" fill-opacity="0.35" d="M0,235 Q240,215 480,235 T960,235 T1440,235 L1440,320 L0,320 Z" />
      <g fill="#d97706" fill-opacity="0.22">
        <path d="M980,320 L1040,255 Q1110,230 1165,215 L1173,172 Q1156,158 1162,135 Q1168,112 1196,112 Q1222,114 1226,136 Q1228,150 1212,163 L1210,182 Q1206,202 1222,218 Q1295,235 1370,268 L1440,320 Z" />
      </g>
      <path fill="#0284c7" fill-opacity="0.16" d="M0,275 Q320,255 640,275 T1280,275 T1440,270 L1440,320 L0,320 Z" />
    </svg>
  </div>

  <!-- ==================== 頂部兩層導覽列 ==================== -->
  <header class="sticky top-0 z-30 bg-white/92 backdrop-blur-md border-b-2 border-sky-200/90 shadow-sm">
    <!-- 第一層：三大單元主分頁 -->
    <div class="widescreen-shell py-2.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-sky-600 to-emerald-600 flex items-center justify-center shadow-md shrink-0">
          <svg class="w-7 h-7" viewBox="0 0 48 48" fill="none">
            <path d="M24 38V22" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
            <path d="M24 24C24 16 14 12 9 16C5 19 8 27 16 27C20 27 24 25 24 24Z" fill="#bef264" stroke="#ffffff" stroke-width="2" />
            <path d="M24 21C24 13 34 9 39 13C43 16 40 24 32 24C28 24 24 22 24 21Z" fill="#fde047" stroke="#ffffff" stroke-width="2" />
            <circle cx="24" cy="39" r="3" fill="#ffffff" />
          </svg>
        </div>
        <div>
          <div class="text-xs sm:text-sm font-bold text-sky-700">康軒五上數學 ・ 16:9 寬螢幕互動教學教室</div>
          <h1 class="text-lg sm:text-2xl font-black text-slate-900 tracking-tight">第 8 單元：整數四則運算</h1>
        </div>
      </div>

      <nav class="grid grid-cols-3 gap-2.5" aria-label="單元小節切換">
        <button id="sec-tab-1" onclick="switchSection(1)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-black text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-sky-600 text-white shadow">
          <span class="px-2 py-0.5 rounded-lg bg-white text-sky-700 text-xs sm:text-sm font-black">8-1</span>
          <span>兩步驟連除問題</span>
        </button>
        <button id="sec-tab-2" onclick="switchSection(2)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-sky-200 hover:bg-sky-50">
          <span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-xs sm:text-sm font-black">8-2</span>
          <span>多步驟問題</span>
        </button>
        <button id="sec-tab-3" onclick="switchSection(3)" class="px-4 sm:px-6 py-2.5 rounded-2xl font-bold text-sm sm:text-base transition-all flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-sky-200 hover:bg-sky-50">
          <span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700 text-xs sm:text-sm font-black">8-3</span>
          <span>分配律</span>
        </button>
      </nav>
    </div>

    <!-- 第二層：子分頁切換（題目 1 / 題目 2 / 題目 3 / 💡 本節核心原理總結） -->
    <div class="bg-sky-50/90 border-t border-sky-100">
      <div class="widescreen-shell py-2">
        <div id="stage-tabs" class="grid grid-cols-4 gap-2.5"></div>
      </div>
    </div>
  </header>

  <!-- ==================== 中央超寬單一主舞台 (96vw / max-w-1560px) ==================== -->
  <main class="relative z-10 flex-1 flex items-center justify-center py-4">
    <section id="main-stage-card" class="widescreen-shell stage-glass rounded-3xl p-5 sm:p-7 flex flex-col justify-between min-h-[630px] stage-enter">

      <!-- 舞台頂部：題目標題與題幹 -->
      <div>
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5 pb-3.5 border-b-2 border-sky-100">
          <div class="space-y-1">
            <div class="flex flex-wrap items-center gap-2.5">
              <span id="stage-pill" class="px-3.5 py-1 rounded-xl bg-sky-600 text-white font-black text-sm sm:text-base">8-1 ・ 題目 1</span>
              <h2 id="stage-heading" class="text-xl sm:text-3xl font-black text-slate-900">女王鉛筆分裝問題</h2>
              <span id="phase-badge" class="px-3 py-0.5 rounded-full bg-amber-100 border border-amber-300 text-amber-900 font-black text-xs sm:text-sm">階段 A：看圖列式</span>

            <p id="stage-problem" class="text-lg sm:text-2xl font-bold text-slate-800 pt-0.5 leading-snug">

          </div>
          <div id="sub-variant-bar" class="flex flex-wrap items-center gap-2 shrink-0"></div>

        <!-- 舞台中央視覺互動 + 遞等式對齊區 -->
        <div id="stage-canvas" class="mt-4"></div>

      <!-- 舞台底部：慢節奏雙向動畫步進控制列 -->

        <button id="btn-beat-reset" onclick="jumpToBeat(0, 'jump')" class="px-4 py-3 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-black text-sm sm:text-base transition active:scale-95 flex items-center gap-1.5">

        </button>

        <!-- 可點擊的步驟進度膠囊 -->

        <button id="btn-beat-next" onclick="handleNextAction()" class="px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-black text-base sm:text-lg shadow-md transition active:scale-95 flex items-center gap-2">
          <span id="btn-beat-next-label">下一步動畫 ▶</span>
        </button>
      </div>
    </section>
  </main>

  <!-- ==================== 完整雙階段教學狀態機與式子變形動畫引擎 ==================== -->
  <script>
    // =========================================================================
    // 1. 全局導覽、計時器清理與步進狀態
    // =========================================================================
    let activeSection = 1; // 1: 8-1, 2: 8-2, 3: 8-3
    let activeStep = 1;    // 1: 題目 1, 2: 題目 2, 3: 題目 3, 4: 💡 本節核心原理總結
    let subVariant = 0;    // 子題型切換（如 8-1 Q3 的 A/B 題，8-3 Q3 的 A/B/C 題）

    document.addEventListener('keydown', (e) => {
      if (activeStep === 4) return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        handleNextAction();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        changeBeat(-1);
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        jumpToBeat(0, 'jump');

    function switchSection(sec) {

      clearChoreographyTimers();

      subVariant = 0;
      renderStage();
    }

    function switchVariant(v) {
      clearChoreographyTimers();
      subVariant = v;
      renderStage();
    }

    function changeBeat(delta) {
      const next = currentBeat + delta;
      if (next >= 0 && next <= maxBeat) {
        jumpToBeat(next, delta > 0 ? 'forward' : 'backward');
      }
    }

    function handleNextAction() {
      if (currentBeat < maxBeat) {
        jumpToBeat(currentBeat + 1, 'forward');
      } else if (activeStep < 4) {
        switchStep(activeStep + 1);
      }
    }

    function jumpToBeat(targetBeat, mode = 'jump') {
      clearChoreographyTimers();
      currentBeat = Math.max(0, Math.min(maxBeat, targetBeat));
      updateControllerUI();
      if (typeof applyBeatFn === 'function') {
        applyBeatFn(currentBeat, mode);
      }
    }

              <div class="mt-3 flex items-center justify-center">
                <div class="w-28 h-12 bg-emerald-500 text-white font-black text-xs flex items-center justify-center rounded-l-xl border-2 border-emerald-700">a × c</div>
                <div class="w-16 h-12 bg-amber-400 text-amber-950 font-black text-xs flex items-center justify-center rounded-r-xl border-2 border-amber-600">b × c</div>
              </div>
            </div>
            <div class="mt-4 p-4 rounded-2xl bg-white border-2 border-emerald-200">
              ${renderAlignedEq([
                { hasEq: false, html: `<span>a × c ＋ b × c</span>` },
                { hasEq: true, active: true, html: `<span>( a ＋ b ) × c</span>` }
              ], 'text-xl sm:text-2xl')}
            </div>
          </div>

          <!-- 卡片 2：減法分配律 -->
          <div class="rounded-3xl bg-sky-50 border-3 border-sky-300 p-6 flex flex-col justify-between shadow-sm">
            <div>
              <span class="px-3.5 py-1 rounded-full bg-sky-600 text-white text-sm font-black">核心原理 ②</span>
              <h3 class="text-2xl font-black text-sky-950 mt-3">減法分配律（面積裁切）</h3>
              <p class="text-base font-bold text-slate-700 mt-2.5 leading-relaxed">
                大長方形減掉一部分算剩下面積時，先把<strong>邊長 (a − b) 相減</strong>，再乘以<strong>共同的乘數 c</strong>！
              </p>
              <div class="mt-3 flex items-center justify-center">
                <div class="w-28 h-12 bg-sky-300 text-sky-950 font-black text-xs flex items-center justify-center rounded-l-xl border-2 border-sky-600">剩 (a−b)×c</div>
                <div class="w-16 h-12 bg-lime-200 text-lime-900 font-black text-xs flex items-center justify-center rounded-r-xl border-2 border-dashed border-orange-500 opacity-65">✂️ b×c</div>
              </div>
            </div>
            <div class="mt-4 p-4 rounded-2xl bg-white border-2 border-sky-200">
              ${renderAlignedEq([
                { hasEq: false, html: `<span>a × c − b × c</span>` },
                { hasEq: true, active: true, html: `<span>( a − b ) × c</span>` }
              ], 'text-xl sm:text-2xl')}
            </div>
          </div>

          <!-- 卡片 3：隱形 × 1 偵測術 -->
          <div class="rounded-3xl bg-amber-50 border-3 border-amber-300 p-6 flex flex-col justify-between shadow-sm">
            <div>
              <span class="px-3.5 py-1 rounded-full bg-amber-500 text-white text-sm font-black">破題秘訣 ③</span>
              <h3 class="text-2xl font-black text-amber-950 mt-3">隱形「× 1」偵測術</h3>
              <p class="text-base font-bold text-slate-700 mt-2.5 leading-relaxed">
                看到算式中單獨出現的相同數字（如 <span class="font-black">＋ 767</span> 或 <span class="font-black">− 586</span>），記得補上隱形的<strong>「× 1」</strong>，才能順利提出公因數合併！
              </p>
            </div>
            <div class="mt-4 p-4 rounded-2xl bg-white border-2 border-amber-200">
              ${renderAlignedEq([
                { hasEq: false, html: `<span>999 × 767 ＋ 767</span>` },
                { hasEq: true, html: `<span>999 × 767 ＋ 767 <span class="text-amber-700 px-1 rounded bg-amber-100">× 1</span></span>` },
                { hasEq: true, active: true, html: `<span>767 × ( 999 ＋ 1 ) ＝ 767000</span>` }
              ], 'text-base sm:text-lg')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 頁面載入啟動
    // =========================================================================
    window.onload = function () {
      renderStage();
    };
  </script>
</body>
</html>
