<!DOCTYPE html>
<html lang="zh-TW">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因數與公因數：互動教學模組</title>
<style>
    body { font-family: '微軟正黑體', sans-serif; background: #f0f8ff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 1000px; justify-content: center; }
    .tab-btn { padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; background: #e0e0e0; border: none; border-radius: 10px 10px 0 0; transition: 0.3s; color: #555; }
    .tab-btn.active { background: white; color: #0056b3; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
    .game-section { background: white; padding: 30px; border-radius: 0 0 20px 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 1000px; display: none; min-height: 500px; }
    .game-section.active { display: block; }
    
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #ccc; }
    .question-text { font-size: 24px; font-weight: 900; color: #222; margin: 0; line-height: 1.5; flex: 1; }
    .g-btn { padding: 10px 20px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: transform 0.1s; white-space: nowrap; }
    .g-btn:active { transform: scale(0.95); }
    .g-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { font-size: 22px; font-weight: bold; min-height: 35px; margin: 15px 0; text-align: center; }

    /* === 第一關：纜車 === */
    #game1 { text-align: center; }
    .g1-options { display: flex; justify-content: center; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
    .g1-opt-btn { padding: 10px 20px; font-size: 20px; border: 2px solid #4caf50; background: white; border-radius: 10px; cursor: pointer; }
    .g1-opt-btn.selected { background: #4caf50; color: white; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .animation-stage { border: 3px solid #b0bec5; border-radius: 15px; height: 350px; background: linear-gradient(to bottom, #81d4fa, #e1f5fe); position: relative; overflow: hidden; display: flex; margin-top: 20px; }
    .platform { width: 25%; background: #cfd8dc; border-right: 4px solid #90a4ae; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; padding: 10px; z-index: 5; }
    .person { font-size: 24px; margin: 2px; } .person.leftover { filter: drop-shadow(0 0 5px red); transform: scale(1.2); }
    .slope-container { position: absolute; top: 180px; left: 20%; width: 120%; transform: rotate(-12deg); transform-origin: left center; z-index: 3; }
    .rope { position: absolute; top: 0; left: -30%; width: 150%; height: 4px; background: #37474f; }
    .cars-container { display: flex; flex-wrap: nowrap; gap: 15px; position: absolute; top: 0; left: 20px; transition: transform 2s ease-in-out; }
    .car-wrapper { display: flex; flex-direction: column; align-items: center; transform: rotate(12deg); transform-origin: top center; margin-top: -2px; } 
    .car-hanger { width: 4px; height: 35px; background: #455a64; position: relative; }
    .car { border: 3px solid #d32f2f; background: rgba(255, 255, 255, 0.9); border-radius: 10px 10px 5px 5px; padding: 5px; min-width: 50px; min-height: 50px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; border-bottom: 8px solid #b71c1c; }
    .car-person { font-size: 18px; margin: 1px; }

    /* === 第二關：因數陣列 === */
    .g2-layout { display: flex; gap: 20px; align-items: flex-start; }
    .g2-interactive-box { flex: 2; background: #fff3e0; border: 4px solid #ffb74d; border-radius: 15px; padding: 20px; position: relative; min-height: 350px; display: flex; flex-direction: column; align-items: center;}
    .g2-controls { background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 20px; align-items: center; font-size: 18px; margin-bottom: 20px; width: 90%; justify-content: center;}
    .g2-grid-container { display: grid; gap: 5px; justify-content: center; transition: 0.3s; }
    .g2-grid-cell { width: 35px; height: 35px; background: #8d6e63; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 20px; animation: popIn 0.2s ease;}
    .g2-sidebar { flex: 1; background: #e8f5e9; padding: 20px; border-radius: 15px; border: 3px solid #81c784; min-height: 350px;}
    .g2-complete-badge { display: none; background: #d32f2f; color: white; font-size: 20px; font-weight: bold; padding: 10px; border-radius: 10px; text-align: center; margin-top: 15px; animation: popIn 0.5s ease; }

    /* === 第三關：磁磚拼貼 === */
    .g3-dashboard { display: flex; justify-content: space-between; background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px; align-items: center; border: 1px solid #ddd; }
    .g3-factors-status { font-size: 18px; font-weight: bold; color: #333; }
    .g3-factors-list { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap;}
    .g3-badge { padding: 5px 12px; background: #ccc; border-radius: 15px; color: white; font-weight: bold; }
    .g3-badge.found { background: #4caf50; }
    .g3-badge.gcf { background: #e91e63; transform: scale(1.1); }
    
    .g3-action-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; background: white; padding: 10px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .tile-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0; }
    .tile-btn { width: 60px; height: 60px; border-radius: 12px; border: 3px solid #aaa; background: white; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tile-btn:hover { background: #e0e0e0; }
    .tile-btn.selected { border-color: #2196f3; background: #bbdefb; transform: scale(1.1); box-shadow: 0 4px 10px rgba(33,150,243,0.3); }
    
    .room-stage-wrapper { text-align: center; margin: 20px 0; padding: 20px; }
    .room { background: #e0e0e0; border: 6px solid #757575; position: relative; display: flex; flex-wrap: wrap; box-shadow: inset 0 0 15px rgba(0,0,0,0.15); margin: 0 auto; align-content: flex-start;}
    .room::before { content: attr(data-top); position: absolute; top: -35px; left: 50%; transform: translateX(-50%); font-weight: bold; color: #d32f2f; font-size: 22px; white-space: nowrap; }
    .room::after { content: attr(data-left); position: absolute; left: -65px; top: 50%; transform: translateY(-50%); font-weight: bold; color: #1976d2; font-size: 22px; white-space: nowrap; }
    
    .tile { box-sizing: border-box; border: 1px solid rgba(255,255,255,0.6); background: #ffca28; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; color: #333; animation: popIn 0.05s ease; overflow: hidden; }
    .tile.out-of-bounds { background: #ef5350 !important; opacity: 0.85; }
    .room.success { border-color: #4caf50; box-shadow: 0 0 20px #4caf50; }
    .room.fail { border-color: #f44336; box-shadow: 0 0 20px #f44336; }

    /* 歷史紀錄與燈箱 */
    .history-area { margin-top: 30px; padding: 20px; background: #fafafa; border: 2px dashed #ccc; border-radius: 10px; }
    .history-container { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; align-items: flex-end;}
    .history-item { display: flex; flex-direction: column; align-items: center; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-width: 150px; cursor: zoom-in; transition: transform 0.2s, box-shadow 0.2s; }
    .history-item:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    .history-item-title { font-weight: bold; margin-bottom: 10px; font-size: 18px; }

    /* 燈箱覆蓋層 */
    .lightbox-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
    
    /* 燈箱關閉按鈕 */
    .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 50px; color: white; background: transparent; border: none; cursor: pointer; z-index: 10001; transition: 0.2s; }
    .lightbox-close:hover { color: #ff5252; transform: scale(1.1); }

    /* 燈箱內部內容 (改為留邊的彈出視窗) */
    .lightbox-content { 
        background: white; padding: 40px; border-radius: 15px; 
        width: 90vw; height: 85vh; max-width: 1000px; 
        overflow: auto; 
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        transform: scale(0.8); cursor: default;
        display: flex; flex-direction: column; align-items: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .lightbox-overlay.active .lightbox-content { transform: scale(1); }

    .floating-icon { position: absolute; font-size: 32px; pointer-events: none; z-index: 50; animation: floatUp 1.5s ease-out forwards; opacity: 0; }
    @keyframes floatUp { 0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; } 50% { opacity: 1; } 100% { transform: translate(var(--tx), -120px) scale(1.3) rotate(var(--rot)); opacity: 0; } }
    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="tab-container">
    <button class="tab-btn active" onclick="switchTab(1)">2-1 纜車平分</button>
    <button class="tab-btn" onclick="switchTab(2)">2-2 麵包陣列</button>
    <button class="tab-btn" onclick="switchTab(3)">2-3 磁磚拼貼</button>
</div>

<!-- ================= 第一關：纜車平分 ================= -->
<div class="game-section active" id="game1">
    <div class="header-row">
        <p class="question-text">有 <strong id="g1-total-text" style="color: #d32f2f;">0</strong> 位遊客要搭乘纜車。請選出所有能「剛好平分」的車廂數量！</p>
        <button class="g-btn" style="background:#ff9800;" onclick="loadNextG1Level()">⏭️ 下一題</button>
    </div>
    <div class="g1-options" id="g1-options-box"></div>
    <div style="text-align: center;"><button class="g-btn" style="background:#2196f3; font-size: 22px; padding: 12px 30px;" id="g1-confirm-btn" onclick="startG1Animation()">✅ 確認分配</button></div>
    <div class="status-msg" id="g1-msg">請選擇上方選項後觀看結果。</div>
    <div class="animation-stage" id="stage1">
        <div class="platform" id="g1-platform"></div>
        <div class="slope-container"><div class="rope"></div><div class="cars-container" id="g1-cars-track"></div></div>
    </div>
</div>

<!-- ================= 第二關：因數陣列 ================= -->
<div class="game-section" id="game2">
    <div class="header-row">
        <p class="question-text">請利用右方的工具，排出剛好 <strong id="g2-target-text" style="color: #d32f2f; font-size: 32px;">12</strong> 個麵包的長方形陣列，找出所有的因數對！</p>
        <button class="g-btn" style="background:#ff9800;" onclick="loadNextG2Level()">⏭️ 換一組麵包</button>
    </div>
    
    <div class="g2-layout">
        <div class="g2-interactive-box" id="stage2">
            <div class="g2-controls">
                <label><b>橫排 (行)：</b> <span id="g2-row-val" style="color:#d32f2f;">1</span></label>
                <input type="range" id="g2-rows" min="1" max="24" value="1" oninput="updateG2Grid()">
                <span style="font-weight:bold; margin: 0 10px;">×</span>
                <label><b>直列 (每排)：</b> <span id="g2-col-val" style="color:#1976d2;">1</span></label>
                <input type="range" id="g2-cols" min="1" max="24" value="1" oninput="updateG2Grid()">
            </div>
            <div class="status-msg" id="g2-msg" style="margin-top:0;">目前排了 1 個麵包</div>
            <div class="g2-grid-container" id="g2-grid"></div>
        </div>

        <div class="g2-sidebar">
            <h3 style="margin-top:0; color:#2e7d32; border-bottom: 2px solid #a5d6a7; padding-bottom:10px;">🎁 已收集的因數對</h3>
            <ul id="g2-factor-pairs" style="font-size: 20px; font-weight: bold; color: #333; line-height: 1.8;"></ul>
            <div class="g2-complete-badge" id="g2-complete">🏆 完美！所有排法都找到了！</div>
        </div>
    </div>
</div>

<!-- ================= 第三關：磁磚拼貼 ================= -->
<div class="game-section" id="game3">
    <div class="header-row">
        <p class="question-text">
            房間長 <strong id="g3-width-text" style="color:#d32f2f;">24</strong> 公分、寬 <strong id="g3-height-text" style="color:#1976d2;">16</strong> 公分。<br>
            選出你認為能<b>完美貼滿不凸出去</b>的所有磁磚，然後一併測試！
        </p>
        <button class="g-btn" style="background:#ff9800;" onclick="loadNextG3Level()">⏭️ 換一個房間</button>
    </div>
    
    <div class="g3-dashboard">
        <div class="g3-factors-status">
            🔍 目標進度：已找到 <span id="g3-found-count" style="color:#e91e63;">0</span> / <span id="g3-total-count">4</span> 個公因數
            <div class="g3-factors-list" id="g3-factors-list"></div>
        </div>
    </div>
    
    <div class="g3-action-row">
        <div class="tile-options" id="tile-options"></div>
        <button class="g-btn" style="background:#2196f3; font-size: 22px; padding: 12px 30px;" id="g3-confirm-btn" onclick="startTileAnimation()">確認鋪設 🔨</button>
    </div>
    
    <div class="status-msg" id="g3-msg">請先選擇一或多個磁磚大小！</div>
    
    <div class="room-stage-wrapper" id="stage3">
        <div class="room" id="room" data-top="長 24" data-left="寬 16"></div>
    </div>
    
    <div class="history-area">
        <h3 style="margin-top:0;">📜 測試紀錄回顧 (點擊圖片可放大檢視)</h3>
        <div class="history-container" id="g3-history"></div>
    </div>
</div>

<!-- 全域燈箱 -->
<div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightboxForce()">✖</button>
    <div id="lightbox-content" class="lightbox-content">
        <!-- 動態產生的大尺寸房間視圖 -->
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => btn.classList.toggle('active', idx + 1 === tabId));
        document.querySelectorAll('.game-section').forEach((sec, idx) => sec.classList.toggle('active', idx + 1 === tabId));
    }
    const delay = ms => new Promise(res => setTimeout(res, ms));
    function spawnEffects(type, elementId) {
        const stage = document.getElementById(elementId);
        const count = 15;
        const emojis = type === 'success' ? ['❤️', '💖', '😄', '✨', '🎉'] : ['💢', '😠', '😤', '🌩️', '💔'];
        for (let i = 0; i < count; i++) {
            const icon = document.createElement('div');
            icon.className = 'floating-icon';
            icon.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            icon.style.left = (30 + Math.random() * 40) + '%';
            icon.style.bottom = '10%';
            icon.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
            icon.style.setProperty('--rot', (Math.random() - 0.5) * 90 + 'deg');
            stage.appendChild(icon);
            setTimeout(() => icon.remove(), 1500);
        }
    }

    // ================= 第一關：纜車 =================
    const g1_levels = [{ total: 12, options: [1,2,3,4,5,6,12] }, { total: 15, options: [1,2,3,4,5,10,15] }, { total: 16, options: [1,2,3,4,6,8,16] }, { total: 24, options: [1,3,4,5,6,8,12,24] }];
    let g1_currentLevel = 0, g1_total = 12, g1_correct = [], g1_selected = [], g1_isAnim = false;
    function loadNextG1Level() { if(g1_isAnim) return; g1_currentLevel = (g1_currentLevel + 1) % g1_levels.length; initGame1(); }
    function initGame1() {
        const level = g1_levels[g1_currentLevel]; g1_total = level.total; g1_correct = level.options.filter(n => g1_total % n === 0); g1_selected = [];
        document.getElementById('g1-total-text').innerText = g1_total; document.getElementById('g1-confirm-btn').disabled = false;
        document.getElementById('g1-msg').innerText = "請選擇上方選項後觀看結果。"; document.getElementById('g1-msg').style.color = "#333";
        const box = document.getElementById('g1-options-box'); box.innerHTML = '';
        level.options.forEach(num => {
            const btn = document.createElement('button'); btn.className = 'g1-opt-btn'; btn.innerText = num + ' 輛';
            btn.onclick = () => {
                if (g1_isAnim) return; const idx = g1_selected.indexOf(num);
                if (idx > -1) { g1_selected.splice(idx, 1); btn.classList.remove('selected'); } else { g1_selected.push(num); btn.classList.add('selected'); }
                g1_selected.sort((a, b) => a - b); 
            }; box.appendChild(btn);
        }); resetG1Stage();
    }
    function resetG1Stage() {
        const platform = document.getElementById('g1-platform'), track = document.getElementById('g1-cars-track');
        track.style.transition = 'none'; track.style.transform = 'translateX(0)'; 
        platform.innerHTML = Array(g1_total).fill('<div class="person">🧍</div>').join(''); track.innerHTML = '';
        setTimeout(() => track.style.transition = 'transform 2.5s ease-in-out', 50);
    }
    async function startG1Animation() {
        if (g1_selected.length === 0) return alert('請至少選擇一個車廂數量！');
        g1_isAnim = true; document.getElementById('g1-confirm-btn').disabled = true;
        const msg = document.getElementById('g1-msg'), track = document.getElementById('g1-cars-track');
        for (let cars of g1_selected) {
            msg.innerText = `測試 ${cars} 輛車廂中...`; msg.style.color = "#2196f3"; resetG1Stage(); await delay(400);
            for(let j=0; j<cars; j++) track.innerHTML += `<div class="car-wrapper"><div class="car-hanger"></div><div class="car"></div></div>`;
            await delay(600);
            const perCar = Math.floor(g1_total / cars), leftover = g1_total % cars;
            document.getElementById('g1-platform').innerHTML = leftover > 0 ? Array(leftover).fill('<div class="person leftover">🧍</div>').join('') : '';
            document.querySelectorAll('.car').forEach(car => car.innerHTML = Array(perCar).fill('<span class="car-person">🧍</span>').join(''));
            await delay(1000);
            if (leftover === 0) {
                track.style.transform = 'translateX(850px)'; await delay(2800);
                msg.innerText = `✔️ 成功整除！纜車返回中...`; track.style.transform = 'translateX(0px)'; await delay(2800);
                spawnEffects('success', 'stage1'); await delay(1000); 
            } else {
                msg.innerText = `❌ 失敗！分到 ${cars} 輛時，剩 ${leftover} 人落單！`; msg.style.color = "#d32f2f";
                spawnEffects('fail', 'stage1'); g1_isAnim = false; document.getElementById('g1-confirm-btn').disabled = false; return;
            }
        }
        if (g1_selected.length === g1_correct.length && g1_correct.every(v => g1_selected.includes(v))) { msg.innerText = `🎉 完美通關！你找出 ${g1_total} 的所有因數了！`; msg.style.color = "#2e7d32"; } 
        else { msg.innerText = `✔️ 成功整除！但還有其他正確的車廂數量喔！`; msg.style.color = "#ff9800"; }
        g1_selected = []; document.querySelectorAll('#g1-options-box .g1-opt-btn').forEach(b => b.classList.remove('selected'));
        g1_isAnim = false; document.getElementById('g1-confirm-btn').disabled = false;
    }

    // ================= 第二關：陣列 =================
    const g2_targets = [12, 16, 18, 24]; const g2_target_pairs = { 12: 3, 16: 3, 18: 3, 24: 4 };
    let g2_current = 0, g2_target = 12, g2_foundPairs = new Set();
    function loadNextG2Level() {
        g2_current = (g2_current + 1) % g2_targets.length; g2_target = g2_targets[g2_current]; g2_foundPairs.clear();
        document.getElementById('g2-target-text').innerText = g2_target; document.getElementById('g2-factor-pairs').innerHTML = ''; document.getElementById('g2-complete').style.display = 'none';
        document.getElementById('g2-rows').max = g2_target; document.getElementById('g2-cols').max = g2_target;
        document.getElementById('g2-rows').value = 1; document.getElementById('g2-cols').value = 1; updateG2Grid();
    }
    function updateG2Grid() {
        const r = parseInt(document.getElementById('g2-rows').value), c = parseInt(document.getElementById('g2-cols').value), total = r * c;
        document.getElementById('g2-row-val').innerText = r; document.getElementById('g2-col-val').innerText = c;
        const grid = document.getElementById('g2-grid'); grid.style.gridTemplateColumns = `repeat(${c}, 35px)`;
        grid.innerHTML = Array(total).fill('<div class="g2-grid-cell">🍞</div>').join('');
        const msg = document.getElementById('g2-msg');
        if (total === g2_target) {
            msg.innerText = `✨ 成功！${r} × ${c} = ${g2_target}`; msg.style.color = '#2e7d32';
            grid.style.borderColor = '#4caf50'; grid.style.background = '#e8f5e9';
            const pairStr = `${Math.min(r,c)} × ${Math.max(r,c)}`; 
            if (!g2_foundPairs.has(pairStr)) {
                g2_foundPairs.add(pairStr); const li = document.createElement('li'); li.innerText = `${r} 排 × ${c} 個 = ${g2_target}`;
                document.getElementById('g2-factor-pairs').appendChild(li); spawnEffects('success', 'stage2');
                if (g2_foundPairs.size === g2_target_pairs[g2_target]) { document.getElementById('g2-complete').style.display = 'block'; msg.innerText = `🎉 恭喜！所有的因數排法都找到了！`; }
            }
        } else {
            msg.innerText = `目前排了 ${total} 個 (目標: ${g2_target})`; msg.style.color = total > g2_target ? '#d32f2f' : '#757575';
            grid.style.borderColor = total > g2_target ? '#ef9a9a' : '#ffb74d'; grid.style.background = total > g2_target ? '#ffebee' : '#fff3e0';
        }
    }

    // ================= 第三關：磁磚批量測試 =================
    const g3_levels = [
        { w: 24, h: 16, tiles: [1, 2, 3, 4, 6, 8, 12, 16] },
        { w: 30, h: 20, tiles: [1, 2, 3, 4, 5, 6, 10, 15] },
        { w: 18, h: 12, tiles: [1, 2, 3, 4, 6, 9, 12] }
    ];
    let g3_current = 0, g3_w = 24, g3_h = 16, g3_scale = 18; 
    let g3_commonFactors = [], g3_gcf = 0, g3_foundFactors = new Set(), g3_selectedTiles = [], g3_isAnimating = false;

    function loadNextG3Level() { if (g3_isAnimating) return; g3_current = (g3_current + 1) % g3_levels.length; initGame3(); }
    function initGame3() {
        const level = g3_levels[g3_current]; g3_w = level.w; g3_h = level.h;
        g3_commonFactors = level.tiles.filter(t => g3_w % t === 0 && g3_h % t === 0); g3_gcf = Math.max(...g3_commonFactors);
        g3_foundFactors.clear(); g3_selectedTiles = [];
        document.getElementById('g3-width-text').innerText = g3_w; document.getElementById('g3-height-text').innerText = g3_h;
        document.getElementById('g3-history').innerHTML = ''; updateG3StatusUI(); resetRoomUI();
        document.getElementById('g3-msg').innerText = "請先選擇一或多個磁磚大小！"; document.getElementById('g3-msg').style.color = '#333';
        const optionsBox = document.getElementById('tile-options'); optionsBox.innerHTML = '';
        level.tiles.forEach(size => {
            const btn = document.createElement('button'); btn.className = 'tile-btn'; btn.innerHTML = size;
            btn.onclick = () => {
                if (g3_isAnimating) return;
                const index = g3_selectedTiles.indexOf(size);
                if (index > -1) { g3_selectedTiles.splice(index, 1); btn.classList.remove('selected'); } 
                else { g3_selectedTiles.push(size); btn.classList.add('selected'); }
                g3_selectedTiles.sort((a,b)=>a-b);
                const msg = document.getElementById('g3-msg');
                if (g3_selectedTiles.length > 0) { msg.innerText = `已選擇：${g3_selectedTiles.join(', ')}，請按確認測試。`; msg.style.color = "#2196f3"; } 
                else { msg.innerText = "請先選擇一或多個磁磚大小！"; msg.style.color = '#333'; }
            }; optionsBox.appendChild(btn);
        });
    }

    function updateG3StatusUI() {
        document.getElementById('g3-found-count').innerText = g3_foundFactors.size; document.getElementById('g3-total-count').innerText = g3_commonFactors.length;
        const listDiv = document.getElementById('g3-factors-list'); listDiv.innerHTML = '';
        g3_commonFactors.forEach(cf => {
            const badge = document.createElement('span'); badge.className = 'g3-badge';
            if (g3_foundFactors.has(cf)) { badge.innerText = cf; badge.classList.add('found'); if(cf === g3_gcf) badge.classList.add('gcf'); } 
            else { badge.innerText = '?'; } listDiv.appendChild(badge);
        });
    }

    function resetRoomUI() {
        const room = document.getElementById('room');
        room.dataset.top = `長 ${g3_w}`; room.dataset.left = `寬 ${g3_h}`;
        room.style.width = `${g3_w * g3_scale}px`; room.style.height = `${g3_h * g3_scale}px`;
        room.innerHTML = ''; room.className = 'room';
    }

    async function startTileAnimation() {
        if (g3_isAnimating) return; if (g3_selectedTiles.length === 0) return alert('請至少選擇一塊磁磚！');
        g3_isAnimating = true; document.getElementById('g3-confirm-btn').disabled = true;
        const room = document.getElementById('room'), msg = document.getElementById('g3-msg');

        for (let size of g3_selectedTiles) {
            resetRoomUI(); msg.innerText = `動畫測試中：正在鋪設 ${size}x${size} 磁磚...`; msg.style.color = "#ff9800";
            const cols = Math.ceil(g3_w / size), rows = Math.ceil(g3_h / size), isCommon = (g3_w % size === 0) && (g3_h % size === 0);
            
            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    const tile = document.createElement('div'); tile.className = 'tile';
                    tile.style.width = `${size * g3_scale}px`; tile.style.height = `${size * g3_scale}px`; tile.innerText = size;
                    // 半透明紅色設定在 out-of-bounds
                    if (c * size >= g3_w || r * size >= g3_h || (c+1)*size > g3_w || (r+1)*size > g3_h) { tile.classList.add('out-of-bounds'); }
                    room.appendChild(tile); await delay(20); 
                }
            }
            if (isCommon) {
                room.classList.add('success'); g3_foundFactors.add(size); updateG3StatusUI();
                if (size === g3_gcf) { msg.innerText = `👑 完美！${size} 是最大公因數！能鋪出最大的正方形！`; msg.style.color = '#e91e63'; } 
                else { msg.innerText = `🎉 成功！${size} 是公因數，磁磚完美貼齊！`; msg.style.color = '#2e7d32'; }
                spawnEffects('success', 'stage3');
            } else {
                room.classList.add('fail'); msg.innerText = `❌ 失敗！${size}x${size} 磁磚會凸出房間邊界 (紅色殘邊)。`; msg.style.color = '#d32f2f';
                spawnEffects('fail', 'stage3');
            }
            addHistory(size, isCommon, rows, cols); await delay(1500);
        }

        if (g3_foundFactors.size === g3_commonFactors.length) { msg.innerText = `🏆 太棒了！你找出了所有可以貼滿房間的磁磚尺寸！`; msg.style.color = "#2e7d32"; } 
        else { msg.innerText = `✔️ 序列測試完畢！還有其他的公因數喔，繼續尋找吧！`; msg.style.color = "#ff9800"; }
        g3_selectedTiles = []; document.querySelectorAll('#tile-options .tile-btn').forEach(b => b.classList.remove('selected'));
        g3_isAnimating = false; document.getElementById('g3-confirm-btn').disabled = false;
    }

    // 將紀錄加入歷史區，並綁定燈箱
    function addHistory(size, isSuccess, rows, cols) {
        const histContainer = document.getElementById('g3-history');
        const miniScale = 5; 
        
        const histItem = document.createElement('div');
        histItem.className = 'history-item';
        
        // 點擊事件：產生高解析度大視圖燈箱
        histItem.onclick = function() {
            const overlay = document.getElementById('lightbox-overlay');
            const content = document.getElementById('lightbox-content');
            content.innerHTML = '';
            
            // 標題與提示文字移到畫面最上方，保證絕對不會被下方的紅磚遮住
            const title = document.createElement('h1');
            title.innerText = `測試磁磚尺寸：${size} × ${size}`;
            title.style.color = isSuccess ? '#2e7d32' : '#d32f2f';
            title.style.margin = '0 0 10px 0';
            title.style.fontSize = '36px';
            content.appendChild(title);

            const hint = document.createElement('p');
            hint.innerText = isSuccess ? "✅ 磁磚完美貼齊，沒有凸出邊界！" : "❌ 磁磚超出房間邊界了，所以不是公因數。";
            hint.style.color = isSuccess ? '#2e7d32' : '#d32f2f';
            hint.style.fontSize = '24px';
            hint.style.fontWeight = 'bold';
            hint.style.margin = '0 0 20px 0';
            content.appendChild(hint);

            // 動態計算滿版所需的比例
            const requiredW = Math.max(g3_w, cols * size);
            const requiredH = Math.max(g3_h, rows * size);
            const availableW = window.innerWidth * 0.8; 
            const availableH = window.innerHeight * 0.6;
            
            let largeScale = Math.min(availableW / requiredW, availableH / requiredH);
            largeScale = Math.max(15, Math.min(largeScale, 40)); 

            const bigRoom = document.createElement('div');
            bigRoom.className = 'room'; 
            bigRoom.dataset.top = `長 ${g3_w}`;
            bigRoom.dataset.left = `寬 ${g3_h}`;
            bigRoom.style.width = `${g3_w * largeScale}px`;
            bigRoom.style.height = `${g3_h * largeScale}px`;
            bigRoom.style.border = `6px solid ${isSuccess ? '#4caf50' : '#f44336'}`;
            bigRoom.style.margin = '30px auto';
            bigRoom.style.boxShadow = 'none';
            
            // 確保滾動條能拉到底
            const overflowY = Math.max(0, (rows * size) - g3_h) * largeScale;
            bigRoom.style.marginBottom = (overflowY + 40) + 'px';

            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    const tile = document.createElement('div');
                    tile.style.boxSizing = 'border-box';
                    tile.style.border = '1px solid rgba(255,255,255,0.7)';
                    tile.style.width = `${size * largeScale}px`;
                    tile.style.height = `${size * largeScale}px`;
                    tile.style.display = 'flex';
                    tile.style.justifyContent = 'center';
                    tile.style.alignItems = 'center';
                    tile.style.fontWeight = 'bold';
                    tile.style.color = 'rgba(0,0,0,0.6)';
                    tile.innerText = size; 
                    
                    tile.style.fontSize = size * largeScale > 30 ? '20px' : (size * largeScale > 15 ? '12px' : '0px'); 

                    // ★ 將紅方塊改為偏透明的紅色 (rgba)
                    if (c * size >= g3_w || r * size >= g3_h || (c+1)*size > g3_w || (r+1)*size > g3_h) {
                        tile.style.background = 'rgba(239, 83, 80, 0.6)';
                    } else {
                        tile.style.background = '#ffca28';
                    }
                    bigRoom.appendChild(tile);
                }
            }
            content.appendChild(bigRoom);
            overlay.classList.add('active');
        };
        
        // 迷你預覽圖
        const title = document.createElement('div'); title.className = 'history-item-title'; title.innerText = `測試: ${size}`; title.style.color = isSuccess ? '#2e7d32' : '#d32f2f';
        const miniRoom = document.createElement('div'); miniRoom.style.width = `${g3_w * miniScale}px`; miniRoom.style.height = `${g3_h * miniScale}px`; miniRoom.style.background = '#e0e0e0'; miniRoom.style.border = `2px solid ${isSuccess ? '#4caf50' : '#f44336'}`; miniRoom.style.position = 'relative'; miniRoom.style.display = 'flex'; miniRoom.style.flexWrap = 'wrap'; miniRoom.style.overflow = 'visible'; miniRoom.style.alignContent = 'flex-start';
        
        for(let r = 0; r < rows; r++) {
            for(let c = 0; c < cols; c++) {
                const tile = document.createElement('div'); tile.style.boxSizing = 'border-box'; tile.style.border = '1px solid rgba(255,255,255,0.4)'; tile.style.width = `${size * miniScale}px`; tile.style.height = `${size * miniScale}px`;
                if (c * size >= g3_w || r * size >= g3_h || (c+1)*size > g3_w || (r+1)*size > g3_h) { tile.style.background = 'rgba(239, 83, 80, 0.6)'; } else { tile.style.background = '#ffca28'; }
                miniRoom.appendChild(tile);
            }
        }
        histItem.appendChild(title); histItem.appendChild(miniRoom); histContainer.insertBefore(histItem, histContainer.firstChild); 
    }

    // 關閉燈箱邏輯：點擊黑底或 X 按鈕皆可
    function closeLightbox(e) {
        if (e.target.id === 'lightbox-overlay' || e.target.classList.contains('lightbox-close')) {
            document.getElementById('lightbox-overlay').classList.remove('active');
        }
    }
    function closeLightboxForce() {
        document.getElementById('lightbox-overlay').classList.remove('active');
    }

    window.onload = () => { initGame1(); updateG2Grid(); initGame3(); };
</script>
</body>
